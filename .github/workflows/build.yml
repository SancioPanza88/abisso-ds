name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NDS libraries
        run: sudo dkp-pacman -S nds-dev --noconfirm

      - name: Build
        run: make

      - name: Upload .nds
        uses: actions/upload-artifact@v4
        with:
          name: abisso-ds
          path: abisso.nds
          if-no-files-found: error
